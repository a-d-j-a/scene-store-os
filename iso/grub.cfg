set timeout=3
set default=0
set gfxmode=auto
set gfxpayload=keep

serial --unit=0 --speed=115200
terminal_input serial console
terminal_output serial console

menuentry "ISO Linux" {
    linux /boot/vmlinuz-6.6.52 root=UUID=auto rw console=tty1 console=ttyS0,115200 loglevel=7
    initrd /boot/initramfs-6.6.52.cpio.gz
}

menuentry "ISO Linux (RAM mode)" {
    linux /boot/vmlinuz-6.6.52 root=UUID=auto rw quiet toram
    initrd /boot/initramfs-6.6.52.cpio.gz
}

menuentry "ISO Linux (safe graphics)" {
    linux /boot/vmlinuz-6.6.52 root=UUID=auto rw nomodeset vga=normal
    initrd /boot/initramfs-6.6.52.cpio.gz
}

menuentry "ISO Linux (verbose)" {
    linux /boot/vmlinuz-6.6.52 root=UUID=auto rw
    initrd /boot/initramfs-6.6.52.cpio.gz
}
