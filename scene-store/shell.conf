# ISO Shell Configuration
# Option=Value format (no spaces around =)

# Background color (ARGB hex)
background_color=0xFF1A1A2E

# Panel (taskbar) settings
panel_height=32
panel_color=0xFF16213E
panel_border=0xFF0F3460
panel_border_w=1
panel_radius=4

# Button (start menu, tasks) settings
button_color=0xFF0F3460
button_border=0xFF533483
button_text=0xFFFFFFFF
hover_color=0xFF2A2A4E

# Label (clock, text) settings
label_text=0xFFE0E0E0

# Clock format (0=24h, 1=12h)
clock_12h=0

# Desktop lock: idle seconds before auto-lock (0 = never). Super+L
# locks manually; the lock screen accepts the first /etc/shadow
# password (empty hash = any password).
autolock_sec=300

# Menu (launcher popup) settings
menu_color=0xFF16213E
menu_border=0xFF0F3460
menu_item_color=0xFF1A1A2E
menu_item_text=0xFFFFFFFF

# Launcher applications (comma-separated)
launcher_apps=terminal,editor,browser

# Wallpaper (leave path empty for no wallpaper)
# Modes: static, ken_burns, slideshow, plasma, aurora, gradient_mesh
wallpaper_path=
wallpaper_mode=plasma
wallpaper_speed=1.0
wallpaper_slideshow_dir=
wallpaper_slideshow_sec=15.0
wallpaper_slideshow_fade=1.0
